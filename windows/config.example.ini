[ldap]
# Adresse Ihres (virtuellen) Konnektors — Praxis-intern, nur aus dem
# Praxisnetz bzw. dem TI-Tunnel erreichbar. Bitte eigenen Wert eintragen.
host = konnektor.ihr-praxisnetz.local
port = 636
# Suchbasis des TI-Verzeichnisdienstes (VZD) — Standard laut gemSpec_VZD
base_dn = dc=data,dc=vzd
# Eigenes Konlan-TLS-Client-Zertifikat (siehe README, Abschnitt Zertifikat).
# Umgebungsvariablen wie %APPDATA% sind erlaubt.
cert = %USERPROFILE%\.ti-adresssuche\client.crt
key = %USERPROFILE%\.ti-adresssuche\client.key
# Maximalzahl der angezeigten Treffer (Server-seitiges Größenlimit)
limit = 60
