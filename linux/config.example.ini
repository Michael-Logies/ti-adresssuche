[ldapsearch]
# Pfad zum flatpak-Programm und die Flathub-ID einer Anwendung, die das
# OpenLDAP-Programm „ldapsearch“ mitbringt (hier: Claws Mail Flatpak).
flatpak = /usr/bin/flatpak
app = org.claws_mail.Claws-Mail

[ldap]
# Adresse Ihres Konnektors/ Ihres Tunnels (LDAPS). Beispiel: Dauer-Tunnel
# per SSH-LocalForward auf die eigene Maschine.
url = ldaps://127.0.0.1:1636
base_dn = dc=data,dc=vzd
# Eigenes Konlan-TLS-Client-Zertifikat (siehe README, Abschnitt Zertifikat).
# WICHTIG: Die Pfade müssen innerhalb des Flatpak-Sandkastens lesbar sein
# (Dateisystem-Override für den Ordner einrichten oder Pfade unter ~/.local/…).
cert = ~/.local/share/ti-adresssuche/client.crt
key = ~/.local/share/ti-adresssuche/client.key
limit = 60
